<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Tagoloan Community College Library</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/static/images/logo.jpg" alt="Tagoloan Community College Logo" class="auth-logo-img">
                <h1 style="font-size: 21px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Tagoloan Community College</h1>
                <p style="font-size: 13.5px; color: var(--text-muted);">Library Management System</p>
            </div>

            {{ALERT_BOX}}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label class="form-label">User ID or Email</label>
                    <input type="text" name="identifier" class="form-control" 
                           placeholder="example@gmail.com or 202_-1234" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    Sign In to Portal
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); font-size: 13.5px; color: var(--text-muted);">
                New student? <a href="/student/register" style="color: var(--primary); font-weight: 600;">Create an account &rarr;</a>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
