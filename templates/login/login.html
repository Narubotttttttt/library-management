<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - Tagoloan Community College Library</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/static/images/logo.jpg" alt="Tagoloan Community College Logo" class="auth-logo-img">
                <h1 style="font-size: 21px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Tagoloan Community College</h1>
                <p style="font-size: 13.5px; color: var(--text-muted);">Library Management System</p>
            </div>

            {{ALERT_BOX}}

            <div class="role-switcher">
                <button type="button" class="role-btn active" data-role="librarian">Librarian / Staff</button>
                <button type="button" class="role-btn" data-role="student">Student</button>
            </div>

            <form action="/login" method="POST">
                <input type="hidden" name="role" id="login-role-input" value="librarian">

                <div class="form-group">
                    <label class="form-label" id="login-id-label">Librarian ID or Email</label>
                    <input type="text" name="identifier" id="login-id-input" class="form-control" 
                           placeholder="example@gmail.com or 202_-1234" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    Sign In to Portal
                </button>
            </form>

            <div style="text-align: center; margin-top: 22px; font-size: 13.5px; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px;">
                <div>New student? <a href="/student/register" style="color: var(--primary); font-weight: 600;">Create an account</a></div>
                <div style="font-size: 12.5px; color: var(--text-dim); display: flex; justify-content: center; gap: 14px; margin-top: 4px;">
                    <a href="/librarian/login">Staff Dedicated Page</a>
                    <span>•</span>
                    <a href="/student/login">Student Dedicated Page</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
