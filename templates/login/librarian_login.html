<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Login - Tagoloan Community College Library</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/static/images/logo.jpg" alt="Tagoloan Community College Logo" class="auth-logo-img">
                <h1 style="font-size: 21px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Tagoloan
                    Community College</h1>
                <p style="font-size: 13.5px; color: var(--text-muted);">Librarian & Staff Portal</p>
                <div
                    style="display: inline-block; margin-top: 10px; padding: 4px 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; color: var(--primary);">
                    Staff Access Only
                </div>
            </div>

            {{ALERT_BOX}}

            <form action="/login" method="POST">
                <input type="hidden" name="role" value="librarian">

                <div class="form-group">
                    <label class="form-label">Librarian ID or Email</label>
                    <input type="text" name="identifier" class="form-control"
                        placeholder="example@gmail.com or 202_-1234" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    Sign In to Staff Portal
                </button>
            </form>

            <div
                style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px;">
                <span>Are you a student? <a href="/student/login"
                        style="color: var(--primary); font-weight: 600;">Student Portal Login &rarr;</a></span>
                <span><a href="/login" style="color: var(--text-dim);">Return to Main Login</a></span>
            </div>
        </div>
    </div>
</body>

</html>
