<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Tagoloan Community College Library</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <img src="/static/images/logo.jpg" alt="Tagoloan Community College Logo" class="auth-logo-img">
                <h1 style="font-size: 21px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Tagoloan Community College</h1>
                <p style="font-size: 13.5px; color: var(--text-muted);">Student Library Registration</p>
            </div>

            {{ALERT_BOX}}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Juan Dela Cruz" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">Student ID</label>
                        <input type="text" name="user_id_number" class="form-control" placeholder="e.g. TCC-2026-001" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Contact Number</label>
                        <input type="text" name="contact_number" class="form-control" placeholder="e.g. 0917-123-4567">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Course & Year Level</label>
                    <input type="text" name="course_year" class="form-control" placeholder="e.g. BS Information Technology - 1st Year" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. juan@student.tcc.edu.ph" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                    Register Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted);">
                Already registered? <a href="/student/login" style="color: var(--primary); font-weight: 600;">Sign in to Student Portal</a>
            </div>
        </div>
    </div>
</body>
</html>
