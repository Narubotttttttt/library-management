<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-header-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <h1 class="login-title">Library Portal</h1>
        <p class="login-subtitle">Sign in to manage inventory or borrow books</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Student ID / Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or 2026000" required
            autofocus>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn-block btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Login
          </button>
          <button type="button" id="btn-show-register" class="btn-block btn-secondary">
            Register
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Registration Modal -->
  <div id="modal-register" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Student Registration</div>
        <button class="modal-close" onclick="closeModal('modal-register')">&times;</button>
      </div>
      <form id="form-register">
        <div class="modal-body">
          <div class="form-group">
            <label for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-input" placeholder="" required>
          </div>
          <div class="form-group">
            <label for="reg-id">Student ID *</label>
            <input type="text" id="reg-id" class="form-input" placeholder="e.g. 2026000" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="reg-course">Course / Year Level</label>
            <input type="text" id="reg-course" class="form-input" placeholder="e.g. BS Computer Science 2">
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="student@gmail.com">
          </div>
          <div class="form-group">
            <label for="reg-contact">Contact Number</label>
            <input type="text" id="reg-contact" class="form-input" placeholder="09123456789">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-register')">Cancel</button>
          <button type="submit" class="btn btn-primary">Complete Registration</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    // --- Helper Utilities ---
    function waitForApi() {
      return new Promise((resolve) => {
        if (window.pywebview && window.pywebview.api) {
          resolve(window.pywebview.api);
          return;
        }
        const onReady = () => {
          window.removeEventListener("pywebviewready", onReady);
          resolve(window.pywebview.api);
        };
        window.addEventListener("pywebviewready", onReady);
        const interval = setInterval(() => {
          if (window.pywebview && window.pywebview.api) {
            clearInterval(interval);
            window.removeEventListener("pywebviewready", onReady);
            resolve(window.pywebview.api);
          }
        }, 50);
      });
    }

    async function callApi(methodName, ...args) {
      try {
        const api = await waitForApi();
        if (typeof api[methodName] === "function") {
          return await api[methodName](...args);
        }
        return { success: false, message: `Method ${methodName} not found` };
      } catch (err) {
        return { success: false, message: String(err) };
      }
    }

    function showToast(message, type = "info") {
      let container = document.getElementById("toast-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "toast-container";
        container.className = "toast-container";
        document.body.appendChild(container);
      }
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      let iconSvg = "";
      if (type === "success") {
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`;
      } else if (type === "error") {
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
      } else {
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
      }
      toast.innerHTML = `${iconSvg}<div class="toast-msg">${String(message).replace(/\n/g, '<br>')}</div>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(50px)";
        toast.style.transition = "all 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = "flex";
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = "none";
    }

    function quickFill(user, pass) {
      const u = document.getElementById("login-username");
      const p = document.getElementById("login-password");
      if (u) u.value = user;
      if (p) p.value = pass;
    }

    // --- Login & Registration Logic ---
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btn-show-register").addEventListener("click", () => {
        openModal("modal-register");
      });

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();

        if (!username || !password) {
          showToast("Please enter both username and password.", "error");
          return;
        }

        const res = await callApi("login", username, password);
        if (res && res.success) {
          showToast(`Welcome back, ${res.user.name}!`, "success");
          setTimeout(() => {
            if (res.user.role === "librarian") {
              window.location.href = "admin.html";
            } else {
              window.location.href = "student.html";
            }
          }, 400);
        } else {
          showToast(res ? res.message : "Invalid credentials", "error");
        }
      });

      document.getElementById("form-register").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("reg-name").value.trim();
        const studentId = document.getElementById("reg-id").value.trim();
        const password = document.getElementById("reg-password").value.trim();
        const course = document.getElementById("reg-course").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const contact = document.getElementById("reg-contact").value.trim();

        const res = await callApi("register", name, studentId, password, email, course, contact);
        if (res && res.success) {
          closeModal("modal-register");
          document.getElementById("form-register").reset();
          quickFill(studentId, password);
          showToast(res.message, "success");
        } else {
          showToast(res ? res.message : "Registration failed", "error");
        }
      });
    });
  </script>
</body>

</html>
